version: "3.8"

services:
  app:
    image: nginx:alpine

    ports:
      - "8080:80"

    networks:
      - autoscalelab-network

    deploy:
      replicas: 1

      restart_policy:
        condition: on-failure
        delay: 5s

      update_config:
        parallelism: 1
        delay: 5s

networks:
  autoscalelab-network:
    driver: overlay