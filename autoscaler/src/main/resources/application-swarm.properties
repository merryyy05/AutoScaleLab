# Profil "swarm" : MODE RÉEL.
# Actif uniquement avec --spring.profiles.active=swarm
#
# L'AutoScaler exécute alors de vraies commandes Docker :
#   docker service inspect <service> --format {{.Spec.Mode.Replicated.Replicas}}
#   docker service scale <service>=N --detach
#
# Prérequis : Docker Swarm initialisé (swarm/init-swarm.sh)
#             et stack déployée (swarm/deploy-stack.sh).
autoscaler.swarm.simulation=false
