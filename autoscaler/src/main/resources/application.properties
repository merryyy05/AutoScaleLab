spring.application.name=autoscaler

# Port de l'API AutoScaler (8080 est réservé à Nginx / Docker Swarm)
server.port=8085

# --- Prometheus ---
prometheus.url=http://localhost:9090
prometheus.connect-timeout=2s
prometheus.read-timeout=5s

# --- Service Swarm surveillé ---
autoscaler.service-name=autoscalelab_app

# --- Règles de scaling ---
autoscaler.cpu-high=75
autoscaler.cpu-low=30
autoscaler.min-replicas=1
autoscaler.max-replicas=5
autoscaler.cooldown=60s

# --- Boucle automatique ---
autoscaler.scheduler.enabled=true
autoscaler.check-interval=15s
autoscaler.initial-delay=10s

# --- Requête CPU ---
# Moyenne du CPU de tous les réplicas du service, publiée par l'exporteur Docker
# (monitoring/docker_exporter.py) avec l'étiquette service="<nom du service>".
# La requête doit renvoyer UNE seule série (d'où avg).
# Le nom du service est repris automatiquement de autoscaler.service-name.
autoscaler.cpu-query=avg(docker_container_cpu_percent{service="${autoscaler.service-name}"})

# --- Docker Swarm ---
# true  = simulation : aucune commande Docker (valeur par défaut)
# false = commandes Docker réelles : activer avec le profil "swarm"
#         (--spring.profiles.active=swarm), voir application-swarm.properties
autoscaler.swarm.simulation=true
autoscaler.docker.command=docker
autoscaler.docker.timeout-seconds=10

# Réplicas de départ du mode simulation uniquement
autoscaler.initial-replicas=1
